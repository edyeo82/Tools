<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tools</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background: Canvas; color: CanvasText; }
  main { width: min(92vw, 760px); margin: 0 auto; padding: 56px 0; }
  h1 { font-size: 42px; margin: 0 0 8px; }
  .intro { opacity: .7; margin: 0 0 32px; }
  .tool { display: block; padding: 20px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 16px; text-decoration: none; color: inherit; }
  .tool:hover { border-color: color-mix(in srgb, CanvasText 45%, transparent); }
  .tool h2 { margin: 0 0 8px; font-size: 24px; }
  .tool p { margin: 0; opacity: .7; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Tools</h1>
  <p class="intro">Small, useful browser tools.</p>
  <a class="tool" href="./40-20-strength-timer/">
    <h2>40/20 Strength Timer</h2>
    <p>Customizable repeating work/rest timer with spoken counting. Defaults to 40 seconds work and 20 seconds rest.</p>
  </a>
</main>
</body>
</html>
